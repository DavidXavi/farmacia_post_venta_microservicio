global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alertas.yml

scrape_configs:
  - job_name: pos-servicios
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - ms-identidad:8080
          - ms-catalogo:8080
          - ms-inventario:8080
          - ms-clientes:8080
          - ms-credito:8080
          - ms-promociones:8080
          - ms-ventas:8080
          - ms-facturacion:8080
          - ms-reportes:8080
